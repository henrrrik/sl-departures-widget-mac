name: SLDepartures
options:
  bundleIdPrefix: io.github.henrrrik
  # English is the source language and lives in the code as the string keys;
  # sv.lproj carries the translation for both bundles.
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

# The logic lives in the local SwiftPM package so it can be exercised with
# `swift test`, with no Xcode in the loop. This project exists only to produce
# the two bundles SwiftPM cannot: an .app and a WidgetKit .appex.
packages:
  SLKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: 8X349UWK2Z
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SLDepartures:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SLKit
        product: SLKit
      - target: SLWidget
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.henrrrik.sl-departures
        PRODUCT_NAME: SL Departures
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode otherwise writes only a token 16pt and 128pt into the app's
        # standalone AppIcon.icns and leaves everything else to Assets.car.
        # The widget gallery renders its sidebar icon from the containing app's
        # .icns, finds nothing big enough there, and draws a generated grey
        # placeholder instead. `all` puts every size in the file.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        ENABLE_APP_SANDBOX: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleName: SL Departures
        CFBundleDisplayName: SL Departures
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A menu bar app: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "MIT"

  SLWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      # The widget gallery draws the extension's own icon in its sidebar, not
      # the containing app's, so the appex carries the same artwork.
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: SLKit
        product: SLKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.henrrrik.sl-departures.widget
        PRODUCT_NAME: SLWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/SLWidget.entitlements
      properties:
        # Mandatory for a macOS app extension, and the extension fetches for
        # itself rather than reading anything the app wrote — which is what
        # keeps this project clear of App Group provisioning.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: SLWidget
        CFBundleDisplayName: SL Departures
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
